spring:
  application:
    name: account-service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC
        format_sql: true
        use_sql_comments: true
    show-sql: false

  jackson:
    default-timezone: UTC
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${SPRING_SERVER_PORT:8081}
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    persist-authorization: true
  api-docs:
    path: /v3/api-docs
  override-with-generic-response: false

jwt:
  expiration:
    access: ${JWT_EXPIRATION_ACCESS} # 15분
    refresh: ${JWT_EXPIRATION_REFRESH} # 30일
  privateKey: ${JWT_PRIVATE_KEY}
  publicKey: ${JWT_PUBLIC_KEY}

internal:
  api-key: ${ACCOUNT_INTERNAL_API_KEY}

user-service:
  url: ${USER_SERVICE_URL}
  api-key: ${USER_INTERNAL_API_KEY}

driver-service:
  url: ${DRIVER_SERVICE_URL}
  api-key: ${DRIVER_INTERNAL_API_KEY}

logging:
  level:
    root: INFO
    com.taxidispatcher: DEBUG
    org.springframework.security: DEBUG
