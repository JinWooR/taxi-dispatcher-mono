<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객 대시보드 - 택시 배차 시스템</title>
  <!-- ✅ 절대 경로 사용 (모든 깊이에서 동일) -->
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .dashboard {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ddd;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      color: #333;
    }

    .user-info {
      text-align: right;
    }

    .user-info p {
      margin: 5px 0;
      font-size: 14px;
      color: #666;
    }

    .btn-logout {
      padding: 8px 16px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-logout:hover {
      background: #c82333;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .menu-item {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f9f9f9;
      text-align: center;
      cursor: pointer;
      transition: background 0.3s, box-shadow 0.3s;
      text-decoration: none;
      color: inherit;
    }

    .menu-item:hover {
      background: #f0f0f0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .menu-item h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #007bff;
    }

    .menu-item p {
      margin: 0;
      font-size: 14px;
      color: #666;
    }

    .content {
      padding: 20px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      display: none;
    }

    .content.active {
      display: block;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 40px;
    }

    .error {
      padding: 15px;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 4px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- 헤더 -->
    <div class="header">
      <h1>고객 대시보드</h1>
      <div class="user-info">
        <p id="user-email">로딩 중...</p>
        <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
      </div>
    </div>

    <!-- 메뉴 -->
    <div class="menu">
      <div class="menu-item" onclick="navigateTo('profile')">
        <h3>📋 프로필</h3>
        <p>프로필 보기 및 수정</p>
      </div>
      <div class="menu-item" onclick="navigateTo('request')">
        <h3>🚕 배차 요청</h3>
        <p>새로운 배차 요청</p>
      </div>
      <div class="menu-item" onclick="navigateTo('list')">
        <h3>📊 내 배차</h3>
        <p>배차 요청 목록</p>
      </div>
    </div>

    <!-- 콘텐츠 영역 -->
    <div id="content" class="content"></div>
  </div>

  <!-- 공통 모듈 로드 (✅ 절대 경로) -->
  <script src="/common/config.js"></script>
  <script src="/common/api.js"></script>
  <script src="/common/auth.js"></script>

  <!-- 서비스 로드 -->
  <script src="/common/services/CustomerService.js"></script>

  <!-- 페이지 로직 -->
  <script src="./index.js"></script>
</body>
</html>
