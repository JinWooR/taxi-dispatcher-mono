<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 택시 배차 시스템</title>
  <!-- ✅ 절대 경로 사용 (모든 깊이에서 동일) -->
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 40px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }

    .login-container h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-login:hover {
      background: #0056b3;
    }

    .btn-login:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .links a {
      color: #007bff;
      text-decoration: none;
      margin: 0 10px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
      display: none;
    }

    .loading {
      display: none;
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>로그인</h1>

    <form id="login-form">
      <div class="form-group">
        <label for="email">이메일</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@mail.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
        >
      </div>

      <button type="submit" class="btn-login" id="btn-login">로그인</button>
    </form>

    <div class="error-message" id="error-message"></div>
    <div class="loading" id="loading">처리 중...</div>

    <div class="links">
      <span>계정이 없으신가요?</span>
      <a href="/samples/pages/auth/register.html">회원가입</a>
    </div>
  </div>

  <!-- 공통 모듈 로드 (필수, ✅ 절대 경로) -->
  <script src="/common/config.js"></script>
  <script src="/common/api.js"></script>
  <script src="/common/auth.js"></script>

  <!-- 서비스 로드 -->
  <script src="/common/services/AuthService.js"></script>

  <!-- 페이지 로직 (상대 경로) -->
  <script src="./login.js"></script>
</body>
</html>
