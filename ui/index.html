<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>택시 배차 시스템</title>
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
    }

    .welcome-container {
      text-align: center;
      color: white;
    }

    .welcome-container h1 {
      font-size: 48px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .welcome-container p {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 50px;
    }

    .role-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .role-button {
      padding: 20px 40px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-decoration: none;
      display: inline-block;
    }

    .role-button.customer {
      background: #4CAF50;
      color: white;
    }

    .role-button.customer:hover {
      background: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .role-button.driver {
      background: #2196F3;
      color: white;
    }

    .role-button.driver:hover {
      background: #0b7dda;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .dashboard {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 40px;
    }

    .logout-button {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }

    .logout-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="welcome-container">
    <h1>🚕 택시 배차 시스템</h1>
    <p>API 흐름 검증용 정적 UI</p>

    <div id="status-section" style="display: none;">
      <div class="role-buttons">
        <a href="/pages/customer/login.html" class="role-button customer">고객 로그인</a>
        <a href="/pages/driver/login.html" class="role-button driver">기사 로그인</a>
      </div>
    </div>

    <div id="dashboard-section" style="display: none;">
      <div class="dashboard">
        <a href="#" id="dashboard-button" class="role-button"></a>
        <button id="logout-button" class="logout-button">로그아웃</button>
      </div>
    </div>
  </div>

  <script type="module" src="/index.js"></script>
</body>
</html>
