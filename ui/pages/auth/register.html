<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 택시 배차 시스템</title>
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .register-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 40px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }

    .register-container h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    .role-options {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .role-option {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-option input[type="radio"] {
      width: auto;
      margin: 0;
      cursor: pointer;
    }

    .role-option label {
      margin: 0;
      cursor: pointer;
      font-weight: normal;
    }

    .btn-register {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-register:hover {
      background: #218838;
    }

    .btn-register:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .links a {
      color: #007bff;
      text-decoration: none;
      margin: 0 10px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
      display: none;
    }

    .loading {
      display: none;
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h1>회원가입</h1>

    <form id="register-form">
      <div class="form-group">
        <label for="email">이메일</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@mail.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
        >
      </div>

      <button type="submit" class="btn-register" id="btn-register">가입하기</button>
    </form>

    <div class="error-message" id="error-message"></div>
    <div class="loading" id="loading">처리 중...</div>

    <div class="links">
      <span>이미 계정이 있으신가요?</span>
      <a href="/pages/auth/login.html">로그인</a>
    </div>
  </div>

  <script type="module" src="./register.js"></script>
</body>
</html>
