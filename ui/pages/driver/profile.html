<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기사 프로필 관리 - 택시 배차 시스템</title>
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .form-section {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 30px;
      background: #fff;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .btn-save {
      flex: 1;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-save:hover {
      background: #218838;
    }

    .btn-save:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .btn-cancel {
      flex: 1;
      padding: 12px;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-cancel:hover {
      background: #5a6268;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      text-align: center;
      display: none;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>기사 프로필 관리</h1>
      <p id="subtitle"></p>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      프로필 정보를 불러오는 중입니다...
    </div>

    <div class="form-section" id="form-section" style="display: none;">
      <form id="profile-form">
        <div class="form-group">
          <label for="name">이름 *</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="예: 홍길동"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">연락처 *</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="예: 010-1234-5678"
            required
          >
        </div>

        <div class="form-group">
          <label for="licenseNumber">운전면허번호 *</label>
          <input
            type="text"
            id="licenseNumber"
            name="licenseNumber"
            placeholder="예: 12-34-567890-12"
            required
          >
        </div>

        <div class="btn-group">
          <button type="submit" class="btn-save" id="btn-save">저장</button>
          <button type="button" class="btn-cancel" id="btn-cancel">취소</button>
        </div>
      </form>

      <div class="message" id="message"></div>
    </div>
  </div>

  <script type="module" src="./profile.js"></script>
</body>
</html>
