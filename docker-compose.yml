version: '3.8'

services:
  # MySQL 데이터베이스
  mysql:
    build:
      context: ./infra/mysql
      dockerfile: Dockerfile
    container_name: taxi-dispatcher-mysql
    platform: linux/amd64
    env_file:
      - envs/common.env
    environment:
      MYSQL_ROOT_HOST: '%'
      TZ: 'Asia/Seoul'
    ports:
      - "3306:3306"
    volumes:
      # 데이터 영속성
      - mysql_data:/var/lib/mysql
      # 초기화 스크립트 (번호 순서대로 실행됨)
      - ./infra/mysql/init-account-schema.sql:/docker-entrypoint-initdb.d/01-account-schema.sql
      - ./infra/mysql/init-account-data.sql:/docker-entrypoint-initdb.d/02-account-data.sql
      - ./infra/mysql/init-customer-schema.sql:/docker-entrypoint-initdb.d/03-customer-schema.sql
      - ./infra/mysql/init-customer-data.sql:/docker-entrypoint-initdb.d/04-customer-data.sql
      - ./infra/mysql/init-driver-schema.sql:/docker-entrypoint-initdb.d/05-driver-schema.sql
      - ./infra/mysql/init-driver-data.sql:/docker-entrypoint-initdb.d/06-driver-data.sql
      - ./infra/mysql/init-dispatcher-schema.sql:/docker-entrypoint-initdb.d/07-dispatcher-schema.sql
      - ./infra/mysql/init-movement-history-schema.sql:/docker-entrypoint-initdb.d/08-movement-history-schema.sql
    networks:
      - taxi-network
    healthcheck:
      # 컨테이너 내부 환경변수 참조 ($$는 docker-compose escape)
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD" ]
      timeout: 20s
      retries: 10
      interval: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Account Service
  account-service:
    build:
      context: .
      dockerfile: services/account-service/Dockerfile
    container_name: account-service
    ports:
      - "8081:8080"
    env_file:
      - envs/common.env
      - envs/account.env
    environment:
      JAVA_OPTS: "-Xms256m -Xmx384m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/account_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
      # Service URLs (Docker Compose 네트워크 내부 통신)
      CUSTOMER_SERVICE_URL: http://customer-service:8080
      DRIVER_SERVICE_URL: http://driver-service:8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taxi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Driver Service
  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    container_name: driver-service
    ports:
      - "8083:8080"
    env_file:
      - envs/common.env
      - envs/driver.env
    environment:
      JAVA_OPTS: "-Xms256m -Xmx384m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/driver_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taxi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Customer Service
  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: customer-service
    ports:
      - "8082:8080"
    env_file:
      - envs/common.env
      - envs/customer.env
    environment:
      JAVA_OPTS: "-Xms256m -Xmx384m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/customer_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taxi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Dispatcher Service
  dispatcher-service:
    build:
      context: .
      dockerfile: services/dispatcher-service/Dockerfile
    container_name: dispatcher-service
    ports:
      - "8084:8080"
    env_file:
      - envs/common.env
      - envs/dispatcher.env
    environment:
      JAVA_OPTS: "-Xms256m -Xmx384m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dispatcher_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taxi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Movement History Service
  movement-history-service:
    build:
      context: .
      dockerfile: services/movement-history-service/Dockerfile
    container_name: movement-history-service
    ports:
      - "8085:8080"
    env_file:
      - envs/common.env
      - envs/movement-history.env
    environment:
      JAVA_OPTS: "-Xms256m -Xmx384m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/movement_history_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taxi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Swagger UI Aggregator (모든 서비스 API 문서 통합 + 동적 타이틀)
  swagger-ui:
    build:
      context: ./infra/swagger-ui
      dockerfile: Dockerfile
    container_name: swagger-ui
    ports:
      - "8090:8080"
    environment:
      URLS: >
        [
          {"url": "http://localhost:8081/v3/api-docs", "name": "Account Service"},
          {"url": "http://localhost:8082/v3/api-docs", "name": "Customer Service"},
          {"url": "http://localhost:8083/v3/api-docs", "name": "Driver Service"},
          {"url": "http://localhost:8084/v3/api-docs", "name": "Dispatcher Service"},
          {"url": "http://localhost:8085/v3/api-docs", "name": "Movement History Service"}
        ]
    # =====================================================================
    # [참고용 / 미사용] 방식 A: command: 인라인 sed 주입
    # ---------------------------------------------------------------------
    # 별도 빌드 단계 없이 공식 이미지에 sed로 index.html을 패치하는 방식.
    # YAML 안에서 따옴표/이스케이프 처리가 복잡하고 한 줄 sed 명령에 JS 전체를
    # 압축해야 하므로 가독성·유지보수성이 낮아 본 프로젝트에서는 위 build:
    # 방식(D, infra/swagger-ui/ 커스텀 이미지)을 채택했다.
    #
    # image: swaggerapi/swagger-ui
    # command:
    #   - sh
    #   - -c
    #   - |
    #     sed -i 's|</body>|<script>(function(){function u(){var s=document.querySelector("select");if(s\&\&s.selectedOptions[0])document.title=s.selectedOptions[0].text;}var o=new MutationObserver(function(){var s=document.querySelector("select");if(s\&\&!s.dataset.t){s.dataset.t="1";s.addEventListener("change",u);u();}});o.observe(document.body,{childList:true,subtree:true});})();</script></body>|' /usr/share/nginx/html/index.html && /docker-entrypoint.sh nginx -g 'daemon off;'
    # =====================================================================
    networks:
      - taxi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  mysql_data:
    driver: local

networks:
  taxi-network:
    driver: bridge
