version: '3.8'

services:
  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: taxi-dispatcher-mysql
    platform: linux/amd64
    env_file:
      - envs/common.env
    environment:
      MYSQL_ROOT_HOST: '%'
      TZ: 'Asia/Seoul'
    ports:
      - "3306:3306"
    volumes:
      # 데이터 영속성
      - mysql_data:/var/lib/mysql
      # 초기화 스크립트 (번호 순서대로 실행됨)
      - ./infra/mysql/init-account-schema.sql:/docker-entrypoint-initdb.d/01-account-schema.sql
      - ./infra/mysql/init-account-data.sql:/docker-entrypoint-initdb.d/02-account-data.sql
      - ./infra/mysql/init-user-schema.sql:/docker-entrypoint-initdb.d/03-user-schema.sql
      - ./infra/mysql/init-user-data.sql:/docker-entrypoint-initdb.d/04-user-data.sql
      - ./infra/mysql/init-driver-schema.sql:/docker-entrypoint-initdb.d/05-driver-schema.sql
      - ./infra/mysql/init-driver-data.sql:/docker-entrypoint-initdb.d/06-driver-data.sql
      - ./infra/mysql/init-dispatcher-schema.sql:/docker-entrypoint-initdb.d/07-dispatcher-schema.sql
    networks:
      - taxi-network
    healthcheck:
      # 컨테이너 내부 환경변수 참조 ($$는 docker-compose escape)
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD" ]
      timeout: 20s
      retries: 10
      interval: 10s
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Account Service
  account-service:
    build:
      context: .
      dockerfile: services/account-service/Dockerfile
    container_name: account-service
    ports:
      - "8081:8080"
    env_file:
      - envs/common.env
      - envs/account.env
    environment:
      JAVA_OPTS: "-Xms256m -Xmx384m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/account_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
      # Service URLs (Docker Compose 네트워크 내부 통신)
      USER_SERVICE_URL: http://user-service:8080
      DRIVER_SERVICE_URL: http://driver-service:8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taxi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Driver Service
  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    container_name: driver-service
    ports:
      - "8083:8080"
    env_file:
      - envs/common.env
      - envs/driver.env
    environment:
      JAVA_OPTS: "-Xms256m -Xmx384m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/driver_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taxi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # User Service
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "8082:8080"
    env_file:
      - envs/common.env
      - envs/user.env
    environment:
      JAVA_OPTS: "-Xms256m -Xmx384m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taxi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Dispatcher Service
  dispatcher-service:
    build:
      context: .
      dockerfile: services/dispatcher-service/Dockerfile
    container_name: dispatcher-service
    ports:
      - "8084:8080"
    env_file:
      - envs/common.env
      - envs/dispatcher.env
    environment:
      JAVA_OPTS: "-Xms256m -Xmx384m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dispatcher_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taxi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Swagger UI Aggregator (모든 서비스 API 문서 통합)
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    ports:
      - "8090:8080"
    environment:
      URLS: >
        [
          {"url": "http://localhost:8081/v3/api-docs", "name": "Account Service"},
          {"url": "http://localhost:8082/v3/api-docs", "name": "User Service"},
          {"url": "http://localhost:8083/v3/api-docs", "name": "Driver Service"},
          {"url": "http://localhost:8084/v3/api-docs", "name": "Dispatcher Service"}
        ]
    networks:
      - taxi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  mysql_data:
    driver: local

networks:
  taxi-network:
    driver: bridge
